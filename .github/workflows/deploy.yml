name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write client env
        # Belt and suspenders: this build step has intermittently NOT picked
        # up PUBLIC_CONTACT_WEBHOOK_URL on this runner (root cause unclear,
        # confirmed non-deterministic across otherwise-identical runs), so
        # write it as a .env.production file in addition to passing it as a
        # process env var below, and fail the build below if neither lands.
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
        run: printf 'PUBLIC_CONTACT_WEBHOOK_URL=%s\n' "$PUBLIC_CONTACT_WEBHOOK_URL" > .env.production

      - name: Build
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
        run: npm run build

      - name: Verify contact webhook URL made it into the build
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
        run: |
          if ! grep -q "$PUBLIC_CONTACT_WEBHOOK_URL" dist/contact/index.html; then
            echo "::error::PUBLIC_CONTACT_WEBHOOK_URL is missing from the built contact page. Refusing to deploy a broken contact form."
            exit 1
          fi

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          # --exclude keeps the blog out of what's synced to production; it still
          # builds locally/in CI for preview, it just never reaches the live site.
          rsync -avz --delete --exclude 'blogs/' -e "ssh -p 65002 -i ~/.ssh/deploy_key" dist/ "$REMOTE_USER@$REMOTE_HOST:~/public_html/"
