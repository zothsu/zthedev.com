name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write client env
        # Astro/Vite's static replacement of import.meta.env.PUBLIC_* only
        # reliably picks up values loaded from a .env file, not a bare
        # process-env var passed via the step's `env:` block, so write one
        # instead of relying on that.
        env:
          PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
        run: printf 'PUBLIC_CONTACT_WEBHOOK_URL=%s\n' "$PUBLIC_CONTACT_WEBHOOK_URL" > .env.production

      - run: npm run build

      - name: TEMP debug env embedding
        run: |
          echo "node: $(node -v)"
          echo "--- .env.production ---"
          cat .env.production || echo "MISSING"
          echo "--- grep dist for webhook host ---"
          grep -r "n8n.wildpear.school" dist/contact/index.html || echo "NOT FOUND IN DIST"
          echo "--- inline module script in dist ---"
          grep -o '<script type="module">.*</script>' dist/contact/index.html | head -c 2000

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          # --exclude keeps the blog out of what's synced to production; it still
          # builds locally/in CI for preview, it just never reaches the live site.
          rsync -avz --delete --exclude 'blogs/' -e "ssh -p 65002 -i ~/.ssh/deploy_key" dist/ "$REMOTE_USER@$REMOTE_HOST:~/public_html/"
