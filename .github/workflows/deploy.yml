name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "== ssh-keyscan =="
          ssh-keyscan -v -T 10 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts || echo "ssh-keyscan exited $?"
          echo "== known_hosts entries =="
          wc -l ~/.ssh/known_hosts

          echo "== ssh connectivity test =="
          ssh -vvv -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$REMOTE_USER@$REMOTE_HOST" echo connected || echo "ssh test exited $?"

          echo "== rsync =="
          rsync -avvz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" dist/ "$REMOTE_USER@$REMOTE_HOST:~/public_html/"
