name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Web3Forms key is set
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
        run: |
          # Prints only the length, never the value. Fails the deploy rather than
          # shipping a contact form that can't send.
          echo "PUBLIC_WEB3FORMS_KEY length: ${#PUBLIC_WEB3FORMS_KEY}"
          if [ -z "${PUBLIC_WEB3FORMS_KEY// }" ]; then
            echo "::error::The PUBLIC_WEB3FORMS_KEY repo secret is empty or missing"
            exit 1
          fi

      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Check the built contact form has its key
        run: |
          # Counts only; never prints page contents or the key.
          echo "web3forms call in dist/index.html: $(grep -c 'api.web3forms.com' dist/index.html)"
          grep -q 'api.web3forms.com' dist/index.html || echo "::warning::Built homepage has no Web3Forms call (key missing at build time)"

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -p 65002 -i ~/.ssh/deploy_key" dist/ "$REMOTE_USER@$REMOTE_HOST:~/public_html/"
